<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>桃色わたがし堂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Zen+Kaku+Gothic+New:wght@300;400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--pink-mid:#f9c6d8;--pink-deep:#d4537e;--pink-dark:#72243e;--gold:#c9a84c;--gold-light:#f5e6c0;--cream:#fffaf5;}
  body{background:var(--cream);font-family:'Zen Kaku Gothic New',sans-serif;font-weight:300;min-height:100vh;color:#3a2030;overflow-x:hidden;}
  .bg-circles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .bg-circles span{position:absolute;border-radius:50%;animation:float 12s ease-in-out infinite;}
  .bg-circles span:nth-child(1){width:400px;height:400px;top:-100px;right:-80px;background:radial-gradient(circle,#f9c6d880 0%,transparent 70%);animation-delay:0s;}
  .bg-circles span:nth-child(2){width:300px;height:300px;bottom:-60px;left:-60px;background:radial-gradient(circle,#f5e6c060 0%,transparent 70%);animation-delay:-4s;}
  .bg-circles span:nth-child(3){width:200px;height:200px;top:40%;left:30%;background:radial-gradient(circle,#ffd6e840 0%,transparent 70%);animation-delay:-8s;}
  @keyframes float{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-20px) scale(1.04);}}
  .wrapper{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:60px 24px 80px;display:flex;flex-direction:column;align-items:center;}
  .eyebrow{font-size:11px;letter-spacing:0.3em;color:var(--gold);text-transform:uppercase;margin-bottom:16px;animation:fadein 0.8s ease both;}
  .hero{display:flex;flex-direction:column;align-items:center;margin-bottom:8px;animation:fadein 0.9s ease both;animation-delay:0.1s;}
  .mascot-wrap{position:relative;width:160px;height:160px;margin-bottom:12px;}
  .mascot-wrap img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 24px rgba(212,83,126,0.18));animation:mascot-float 4s ease-in-out infinite;}
  @keyframes mascot-float{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  .logo-box{text-align:center;background:rgba(255,250,245,0.85);border:0.5px solid var(--pink-mid);border-radius:20px;padding:20px 36px 16px;backdrop-filter:blur(4px);}
  .logo-en{font-family:'Shippori Mincho',serif;font-size:11px;letter-spacing:0.3em;color:var(--pink-deep);display:block;margin-bottom:4px;}
  .logo-ja{font-family:'Shippori Mincho',serif;font-size:32px;font-weight:800;background:linear-gradient(135deg,var(--pink-dark) 0%,var(--pink-deep) 40%,var(--gold) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:0.12em;line-height:1.2;display:block;}
  .deco-line{display:flex;align-items:center;gap:12px;margin:24px 0 16px;width:100%;max-width:340px;animation:fadein 1s ease both;animation-delay:0.2s;}
  .deco-line::before,.deco-line::after{content:'';flex:1;height:0.5px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
  .deco-mark{font-family:'Shippori Mincho',serif;font-size:14px;color:var(--gold);}
  .tagline{font-size:13px;letter-spacing:0.15em;color:#a06070;margin-bottom:40px;animation:fadein 1s ease both;animation-delay:0.25s;}
  .shipping-banner{
    width:100%;margin-bottom:20px;
    background:linear-gradient(135deg,rgba(249,198,216,0.3) 0%,rgba(245,230,192,0.3) 100%);
    border:0.5px solid var(--pink-mid);border-radius:12px;
    padding:14px 20px;
    display:flex;align-items:center;justify-content:center;gap:10px;
    animation:fadein 0.9s ease both;animation-delay:0.28s;
  }
  .shipping-icon{font-size:16px;}
  .shipping-text{font-size:12px;letter-spacing:0.08em;color:var(--pink-dark);}
  .shipping-text strong{font-weight:600;color:var(--pink-deep);}
  .shops{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;width:100%;margin-bottom:48px;}
  .shop-card{position:relative;overflow:hidden;background:#fffbfc;border:0.5px solid var(--pink-mid);border-radius:16px;padding:28px 20px 24px;text-decoration:none;color:inherit;display:flex;flex-direction:column;align-items:flex-start;gap:8px;transition:transform 0.3s ease,box-shadow 0.3s ease,border-color 0.3s ease;animation:cardin 0.7s ease both;}
  .shop-card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(212,83,126,0.12);border-color:var(--pink-deep);}
  .shop-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--pink-mid),var(--gold),var(--pink-deep));opacity:0;transition:opacity 0.3s ease;}
  .shop-card:hover::before{opacity:1;}
  .shop-card:nth-child(1){animation-delay:0.3s;} .shop-card:nth-child(2){animation-delay:0.4s;} .shop-card:nth-child(3){animation-delay:0.5s;} .shop-card:nth-child(4){animation-delay:0.6s;}
  .shop-badge{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;padding:3px 8px;border-radius:4px;font-weight:400;}
  .shop-name{font-family:'Shippori Mincho',serif;font-size:18px;font-weight:600;line-height:1.3;}
  .shop-desc{font-size:11px;color:#c090a8;letter-spacing:0.05em;}
  .shop-arrow{position:absolute;bottom:20px;right:20px;width:28px;height:28px;border-radius:50%;border:0.5px solid var(--pink-mid);display:flex;align-items:center;justify-content:center;transition:background 0.3s,border-color 0.3s;}
  .shop-card:hover .shop-arrow{background:var(--pink-deep);border-color:var(--pink-deep);}
  .shop-card:hover .shop-arrow svg{stroke:#fff;}
  .rakuten .shop-badge{background:#fff0ee;color:#bf0000;} .rakuten .shop-name{color:#bf0000;}
  .yahoo .shop-badge{background:#f0f4ff;color:#3352cc;} .yahoo .shop-name{color:#3352cc;}
  .qoo .shop-badge{background:#f3f0ff;color:#6640cc;} .qoo .shop-name{color:#4a2ea8;}
  .amazon .shop-badge{background:#f2f2f2;color:#333333;} .amazon .shop-name{color:#111111;}
  .mercari .shop-badge{background:#fff0f5;color:#d4537e;} .mercari .shop-name{color:#a03060;}
  .aupay .shop-badge{background:#f0f5ff;color:#0055aa;} .aupay .shop-name{color:#003388;}
  .aupay{opacity:0.55;cursor:default;pointer-events:none;}
  .shop-card:nth-child(5){animation-delay:0.7s;} .shop-card:nth-child(6){animation-delay:0.8s;}
  .more-section{width:100%;padding:32px 28px;border:0.5px dashed var(--pink-mid);border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:6px;animation:fadein 0.8s ease both;animation-delay:0.75s;}
  .more-label{font-size:11px;letter-spacing:0.2em;color:#c8a0b8;text-transform:uppercase;}
  .more-text{font-family:'Shippori Mincho',serif;font-size:14px;color:#b080a0;letter-spacing:0.1em;}
  .footer{margin-top:60px;text-align:center;animation:fadein 0.8s ease both;animation-delay:0.9s;}
  .footer p{font-size:11px;color:#c8a0b8;letter-spacing:0.15em;}
  @keyframes fadein{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
  @keyframes cardin{from{opacity:0;transform:translateY(16px) scale(0.97);}to{opacity:1;transform:none;}}
</style>
</head>
